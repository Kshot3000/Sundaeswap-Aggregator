<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SundaeSwap DEX Aggregator</title>
<style>
body{font-family:system-ui,sans-serif;margin:2rem;background:#0b1220;color:#e2e8f0}
.card{background:#1e293b;padding:1rem;border-radius:12px;margin-bottom:1rem}
input,select,button{padding:0.5rem;margin:0.25rem}
button{background:#38bdf8;color:#0b1220;border:none;border-radius:6px;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:1rem}
th,td{padding:0.5rem;border-bottom:1px solid #334155;text-align:left}
</style>
</head>
<body>
<h1>SundaeSwap DEX Aggregator</h1>
<div class="card">
<label>From<br><input id="from" value="ADA"></label>
<label>To<br><input id="to" value="USDC"></label>
<label>Amount<br><input id="amount" type="number" value="1000"></label>
<button onclick="run()">Get Best Quote</button>
</div>
<div class="card">
<table id="results"><thead><tr><th>DEX</th><th>Net Out</th><th>Fee</th></tr></thead><tbody></tbody></table>
</div>
<script>
const dexes=["SundaeSwap","Minswap","WingRiders","Jupiter"];
function run(){
 const from=document.getElementById('from').value;
 const to=document.getElementById('to').value;
 const amt=parseFloat(document.getElementById('amount').value);
 const tbody=document.querySelector('#results tbody');
 tbody.innerHTML='';
 const spreads={"SundaeSwap":0.995,"Minswap":0.998,"WingRiders":0.992,"Jupiter":0.997};
 const base=from==="ADA"&&to==="USDC"?0.5:2.0;
 const rows=[];
 dexes.forEach(d=>{
   const price=amt*base*spreads[d];
   const fee=price*0.003;
   const net=price-fee;
   rows.push({dex:d,net,fee});
 });
 rows.sort((a,b)=>b.net-a.net);
 rows.forEach(r=>{
   const tr=document.createElement('tr');
   tr.innerHTML=`<td>${r.dex}</td><td>${r.net.toFixed(6)}</td><td>${r.fee.toFixed(6)}</td>`;
   tbody.appendChild(tr);
 });
}
run();
</script>
</body>
</html>
